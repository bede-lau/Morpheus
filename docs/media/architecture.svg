<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">Morpheus system architecture</title>
<desc id="desc">Room scans and tasks enter a React client, which connects to environment and object services. These services use geometry validation, task planning, and object matching. The system displays recorded and planned robot rollouts; these are not learned locomotion.</desc>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63f4cf"/><stop offset=".52" stop-color="#42b8ff"/><stop offset="1" stop-color="#ad78ff"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#193d36" stop-opacity=".65"/><stop offset="1" stop-color="#0a0e0d" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#6b8d81" stroke-width="1.5"/></marker>
</defs>
<rect width="1600" height="1120" rx="18" fill="#0a0e0d"/>
<rect width="1600" height="1120" rx="18" fill="url(#grid)"/>
<ellipse cx="870" cy="-40" rx="790" ry="400" fill="url(#glow)"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <text x="66" y="64" fill="#79e7bc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3">MORPHEUS / SYSTEM MAP</text>
  <text x="66" y="120" fill="#f2f8f5" font-size="48" font-weight="650" letter-spacing="-1.5">From room scan to robot verdict</text>
  <text x="66" y="151" fill="#8da59a" font-size="19">A map of the current demo architecture and its evidence boundaries.</text>
  <rect x="1260" y="59" width="274" height="42" rx="21" fill="#112b22" stroke="#275e48"/>
  <circle cx="1284" cy="80" r="5" fill="#67e9af"/><text x="1301" y="86" fill="#b3e7ce" font-family="ui-monospace, Menlo, monospace" font-size="15">SYSTEM OVERVIEW</text>
  <!-- Inputs -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#789487" letter-spacing="2"><text x="66" y="205">01 / INPUTS</text></g>
  <g fill="#101916" stroke="#2b4038"><rect x="66" y="222" width="464" height="70" rx="12"/><rect x="568" y="222" width="464" height="70" rx="12"/><rect x="1070" y="222" width="464" height="70" rx="12"/></g>
  <g fill="url(#accent)"><rect x="84" y="241" width="4" height="32" rx="2"/><rect x="586" y="241" width="4" height="32" rx="2"/><rect x="1088" y="241" width="4" height="32" rx="2"/></g>
  <g fill="#e4eee8" font-size="21" font-weight="600"><text x="105" y="251">Room capture</text><text x="607" y="251">Collision geometry</text><text x="1109" y="251">Task + robot</text></g>
  <g fill="#8da59a" font-family="ui-monospace, Menlo, monospace" font-size="15"><text x="105" y="276">Gaussian splat · SPZ / PLY</text><text x="607" y="276">companion mesh · GLB</text><text x="1109" y="276">kitchen chore · body selection</text></g>
  <!-- Client -->
  <path d="M298 292V329 M800 292V329 M1302 292V329" fill="none" stroke="#6b8d81" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="66" y="335" width="1468" height="154" rx="16" fill="#111b17" stroke="#365247"/>
  <text x="90" y="371" fill="#9eddbd" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="2">02 / CLIENT</text>
  <text x="1290" y="371" fill="#89a69a" font-family="ui-monospace, Menlo, monospace" font-size="15">REACT · THREE.JS · SPARK</text>
  <g fill="#182720" stroke="#365348"><rect x="90" y="391" width="332" height="70" rx="10"/><rect x="438" y="391" width="332" height="70" rx="10"/><rect x="786" y="391" width="332" height="70" rx="10"/><rect x="1134" y="391" width="376" height="70" rx="10"/></g>
  <g fill="#eff7f2" font-size="21" font-weight="600"><text x="110" y="420">Morph-to-sim</text><text x="458" y="420">Workspace</text><text x="806" y="420">Objects</text><text x="1154" y="420">Builder</text></g>
  <g fill="#90a89c" font-size="16"><text x="110" y="445">scene + robot comparison</text><text x="458" y="445">tasks · POV · replay</text><text x="806" y="445">inspect · identify · swap</text><text x="1154" y="445">colliders · export</text></g>
  <!-- API connectors -->
  <path d="M800 489V514H420V548 M800 514H1180V548" fill="none" stroke="#6b8d81" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="530" fill="#719182" font-family="ui-monospace, Menlo, monospace" font-size="14">/api</text><text x="1202" y="530" fill="#719182" font-family="ui-monospace, Menlo, monospace" font-size="14">/api/objects</text>
  <!-- Services -->
  <rect x="66" y="556" width="708" height="126" rx="14" fill="#17241e" stroke="#44745b"/>
  <rect x="826" y="556" width="708" height="126" rx="14" fill="#17241e" stroke="#44745b"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1.7" fill="#7de4ad"><text x="90" y="585">03 / ENVIRONMENT SERVICE · :8000</text><text x="850" y="585">03 / OBJECT SERVICE · :8001</text></g>
  <g fill="#f1f8f3" font-size="23" font-weight="600"><text x="90" y="622">pipeline.server</text><text x="850" y="622">pipeline.object_server</text></g>
  <g fill="#a2b8ab" font-size="17"><text x="90" y="650">environments · tasks · replays · validate · export</text><text x="850" y="650">catalogue · object matching · saved scene · assets</text></g>
  <!-- Engine connectors -->
  <path d="M420 682V706H290V739 M420 706H800V739 M1180 682V706H1310V739" fill="none" stroke="#6b8d81" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Engines -->
  <g fill="#121b18" stroke="#304a3e"><rect x="66" y="748" width="448" height="142" rx="14"/><rect x="576" y="748" width="448" height="142" rx="14"/><rect x="1086" y="748" width="448" height="142" rx="14"/></g>
  <g fill="#79d9aa" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1.5"><text x="90" y="778">04 / GEOMETRY + PHYSICS</text><text x="600" y="778">04 / TASK PLANNING</text><text x="1110" y="778">04 / OBJECT PIPELINE</text></g>
  <g fill="#eef6f0" font-size="22" font-weight="600"><text x="90" y="816">MJCF + MuJoCo</text><text x="600" y="816">Landmarks + A*</text><text x="1110" y="816">Matching + SimReady</text></g>
  <g fill="#9cb2a6" font-size="16"><text x="90" y="844">collision boxes · compile · drop probe</text><text x="600" y="844">occupancy grid · scripted actions</text><text x="1110" y="844">classify · convert · swap</text><text x="90" y="869">scene.json + environment.xml export</text><text x="600" y="869">10 Hz replay · per-step feasibility</text><text x="1110" y="869">offline discovery feeds the saved scene</text></g>
  <!-- Dependencies and evidence -->
  <rect x="66" y="930" width="1468" height="124" rx="14" fill="#0e1713" stroke="#293f35"/>
  <text x="90" y="960" fill="#789487" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1.7">INTEGRATIONS + RECORDED EVIDENCE</text>
  <g fill="#d6e6dc" font-size="18" font-weight="600"><text x="90" y="994">MuJoCo</text><text x="380" y="994">OpenAI + Codex</text><text x="735" y="994">NVIDIA SimReady</text><text x="1110" y="994">Saved outputs</text></g>
  <g fill="#859e90" font-size="15"><text x="90" y="1019">compile + contact probe</text><text x="380" y="1019">Responses · Decisions · CLI</text><text x="735" y="1019">catalogue + prepared meshes</text><text x="1110" y="1019">scenes · detections · rollouts</text></g>
  <path d="M350 976V1025 M705 976V1025 M1080 976V1025" stroke="#2a4036"/>
  <text x="66" y="1093" fill="#8da59a" font-family="ui-monospace, Menlo, monospace" font-size="15">PLANNED MOTION + SCRIPTED ACTIONS  /  NOT LEARNED LOCOMOTION  /  SCENE SCALE ASSUMED</text>
  <rect x="1436" y="1080" width="98" height="3" rx="1.5" fill="url(#accent)"/>
</g>
</svg>
