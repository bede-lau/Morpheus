  <title>Morpheus — See your home through new eyes</title>
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;display:block}body{background:#f1f5f2}</style>
</head>
<body>
  <iframe id="morpheus" title="Morpheus" allow="fullscreen; clipboard-write"></iframe>
  <script>
    const appOrigin = 'https://morpheus-production-992a.up.railway.app';
    const visitorKey = 'morpheus-visitor-v1';
    const randomVisitor = () => Array.from(crypto.getRandomValues(new Uint8Array(32)), n => n.toString(16).padStart(2, '0')).join('');
    let visitor;
    try {
      const saved = localStorage.getItem(visitorKey);
      visitor = saved && /^[0-9a-f]{64}$/.test(saved) ? saved : randomVisitor();
      localStorage.setItem(visitorKey, visitor);
    } catch { visitor = randomVisitor(); }
    const frame = document.getElementById('morpheus');
    window.addEventListener('message', event => {
      if (event.source === frame.contentWindow && event.origin === appOrigin && event.data?.type === 'morpheus-visitor-request') {
        frame.contentWindow.postMessage({type: 'morpheus-visitor', visitor}, appOrigin);
      }
    });
    frame.src = appOrigin + '/?release=visitor-v1';
  </script>
  <noscript>JavaScript is required. <a href="https://morpheus-production-992a.up.railway.app/">Open Morpheus</a>.</noscript>
</body>
