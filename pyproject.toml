[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "morpheus-home-policy"
version = "0.1.0"
description = "Robot-specific policy inference and MuJoCo verification for supplied home scenes"
requires-python = ">=3.12,<3.13"
dependencies = ["mujoco==3.17.0", "numpy==2.5.4", "torch==2.15.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
morpheus-policy = "morpheus_policy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/morpheus_policy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
