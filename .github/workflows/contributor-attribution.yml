name: Contributor attribution

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contributor-attribution:
    name: Contributor attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check commit identities and co-authors
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BLOCKED_CONTRIBUTOR_PATTERN: ${{ vars.BLOCKED_CONTRIBUTOR_PATTERN }}
        run: |
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          pattern = os.environ.get("BLOCKED_CONTRIBUTOR_PATTERN", "")
          if not pattern:
              raise SystemExit("::error::The contributor attribution policy is not configured.")
          blocked = re.compile(pattern)
          base = os.environ["GITHUB_API_URL"].rstrip("/")
          repository = os.environ["GITHUB_REPOSITORY"]
          sha = urllib.parse.quote(os.environ["TARGET_SHA"], safe="")
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          }
          count = 0
          rejected = []
          page = 1
          while True:
              url = f"{base}/repos/{repository}/commits?sha={sha}&per_page=100&page={page}"
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  commits = json.load(response)
              if not isinstance(commits, list):
                  raise SystemExit("::error::Unable to read commit attribution.")
              for item in commits:
                  metadata = item["commit"]
                  fields = [metadata.get("message", "")]
                  for role in ("author", "committer"):
                      identity = metadata.get(role) or {}
                      fields.extend([identity.get("name", ""), identity.get("email", "")])
                  if any(blocked.search(value) for value in fields):
                      rejected.append(item["sha"])
                  count += 1
              if len(commits) < 100:
                  break
              page += 1
          if rejected:
              for commit in rejected:
                  print(f"::error::Commit {commit} contains disallowed contributor attribution.")
              raise SystemExit(1)
          if not count:
              raise SystemExit("::error::No commits were available to verify.")
          print(f"Checked {count} commits; contributor attribution policy passed.")
